<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – JobPortal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:520px">
      <h2>Create Account 🚀</h2>

      <div id="alert-box" class="alert hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span style="font-weight:400;color:var(--text-muted)">(min 6 chars)</span></label>
          <input type="password" id="password" placeholder="Create a password" required minlength="6" />
        </div>

        <div class="form-group">
          <label for="role">I am a…</label>
          <select id="role" required>
            <option value="jobseeker">Job Seeker</option>
            <option value="employer">Employer / Recruiter</option>
          </select>
        </div>

        <div class="form-group" id="company-group" style="display:none">
          <label for="company">Company Name</label>
          <input type="text" id="company" placeholder="Your company name" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
      </form>

      <p class="subtitle">Already have an account? <a href="login.html">Login</a></p>
      <p class="subtitle" style="margin-top:.5rem"><a href="index.html">← Back to Jobs</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (getToken()) window.location.href = 'dashboard.html';

    document.getElementById('role').addEventListener('change', (e) => {
      document.getElementById('company-group').style.display =
        e.target.value === 'employer' ? 'block' : 'none';
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const payload = {
          name:     document.getElementById('name').value,
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
          role:     document.getElementById('role').value,
          company:  document.getElementById('company').value || undefined,
        };
        const data = await Auth.register(payload);
        saveUser(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('alert-box', err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
