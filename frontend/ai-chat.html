<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat | JobPortal</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .ai-chat-container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px #0001; padding: 24px; }
    #aiChatBox { height: 320px; overflow-y: auto; background: #f6f8fa; border-radius: 6px; padding: 12px; margin-bottom: 16px; font-size: 1rem; }
    .chat-msg { margin-bottom: 10px; }
    .user-msg { text-align: right; color: #2563eb; }
    .ai-msg { text-align: left; color: #111; }
    .error-msg { color: #b91c1c; }
    #aiChatInput { width: 80%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    #aiChatForm button { padding: 8px 16px; border-radius: 4px; background: #2563eb; color: #fff; border: none; }
  </style>
</head>
<body>
  <div class="ai-chat-container">
    <h2>AI Chat Assistant</h2>
    <div id="aiChatBox"></div>
    <form id="aiChatForm" autocomplete="off">
      <input id="aiChatInput" type="text" placeholder="Ask me anything..." required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
